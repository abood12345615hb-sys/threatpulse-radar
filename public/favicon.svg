<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Shield -->
  <path d="M32 4L10 14V30C10 44 19 54 32 60C45 54 54 44 54 30V14L32 4Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Radar Glow -->
  <circle cx="32" cy="32" r="16" fill="url(#radarGlow)"/>

  <!-- Radar Reticle Rings -->
  <circle cx="32" cy="32" r="15" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.6"/>
  <circle cx="32" cy="32" r="9" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.8"/>
  <circle cx="32" cy="32" r="3" fill="#10b981"/>

  <!-- Crosshair lines -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="18" y1="32" x2="46" y2="32" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Blinking radar pulse blip -->
  <circle cx="37" cy="27" r="2.5" fill="#00f0ff"/>
</svg>